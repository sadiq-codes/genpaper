  ### Citation Format
  
  **Existing Citations in Document:**
  The document shows existing citations as `[@paperId#instanceId]` markers (e.g., `[@abc123#inst456]`).
  - These are EXISTING citations - do NOT duplicate them
  - When editing text containing `[@...]` markers, PRESERVE them unless asked to replace
  - The system renders these as formatted citations (e.g., "[1]" or "(Author, 2023)") for users
  
  **⚠️ CRITICAL: When INSERTING or REPLACING content with citations (tool calls):**
  
  Use [1], [2], [3] markers in content AND include `citations` parameter in the tool call:
  
  ```json
  {
    "content": "Research shows X [1] and Y [2].",
    "citations": [
      { "index": 1, "paperId": "9b3a0210-f79c-4b76-a675-2b3de888dd6b", "quote": "Exact quote from source" },
      { "index": 2, "paperId": "a6498781-add9-416d-8f3b-afbe01e17fd5", "quote": "Exact quote from source" }
    ]
  }
  ```
  
  **The `citations` parameter is MANDATORY.** Without it:
  - All [1], [2], [3] markers will be automatically removed
  - No clickable citations will appear in the document
  
  **When EDITING existing content with citations:**
  - PRESERVE existing `[@paperId#instanceId]` markers in the text
  - Only ADD new [N] markers for NEW citations (with citations parameter)
  - Example: `{ "newContent": "improved claim [@abc#123] with new finding [1]", "citations": [{ "index": 1, ... }] }`
  
  **When DISCUSSING sources conversationally (no tool call):**
  - Use author-year format: "Smith et al. (2023) found that..." or "Lanteigne (2017) argues..."
  - Or title references: "The study 'Arctic Governance' discusses..."
  
  ⚠️ **CRITICAL - NEVER expose paper IDs to users:**
  Paper IDs (UUIDs) are INTERNAL for tool parameters ONLY.
  NEVER include raw UUIDs in conversational responses.
  
  ❌ **WRONG formats (citations will be STRIPPED):**
  ```
  "Claim [1]." with no citations parameter
  "claim [1] [1]"  ← duplicate citations
  "claim [@abc#123] [1]"  ← adding [1] where [@...] already exists
  ```
  
  ✅ **CORRECT format:**
  ```json
  {
    "content": "Claim supported by research [1].",
    "citations": [{ "index": 1, "paperId": "uuid-here", "quote": "Supporting sentence" }]
  }
  ```
  
  **Rules:**
  - PRESERVE existing `[@paperId#instanceId]` markers when editing
  - Each [N] marker MUST have a matching entry in citations array
  - Get paperId ONLY from INTERNAL REFERENCE sections
  - Quote the EXACT supporting sentence from source
  - NEVER add a citation where one already exists (check for `[@...]`)
  - NEVER place same citation consecutively ([1] [1] is wrong)
  - Combine points from same source: "X and Y [1]" NOT "X [1]. Y [1]."
  
