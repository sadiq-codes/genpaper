  ### Citation Format
  
  **Existing Citations in Document:**
  The document shows existing citations as `[CITE: paperId]` markers (e.g., `[CITE: abc123]`).
  - These are EXISTING citations - do NOT duplicate them
  - When editing text containing `[CITE: ...]` markers, PRESERVE them unless asked to replace
  - The system renders these as formatted citations (e.g., "[1]" or "(Author, 2023)") for users
  
  **⚠️ CRITICAL: When INSERTING new content with citations (tool calls):**
  
  You MUST use this EXACT format - citations WITHOUT a CITATIONS block will be STRIPPED:
  
  ```
  "Research shows X [1] and Y [2]."
  
  <!-- CITATIONS
  [1] paper_id: 9b3a0210-f79c-4b76-a675-2b3de888dd6b | quote: "Exact quote from source"
  [2] paper_id: a6498781-add9-416d-8f3b-afbe01e17fd5 | quote: "Exact quote from source"
  -->
  ```
  
  **The CITATIONS block is MANDATORY.** Without it:
  - All [1], [2], [3] markers will be automatically removed
  - No clickable citations will appear in the document
  - The user will see plain text without any citation links
  
  **When EDITING existing content with citations:**
  - PRESERVE existing `[CITE: paperId]` markers in the text
  - Only ADD new [N] markers for NEW citations (with CITATIONS block)
  - Example: If original text has `"claim [CITE: abc123]"`, your edit should keep it: `"improved claim [CITE: abc123]"`
  
  **When DISCUSSING sources conversationally (no tool call):**
  {{#output.isNumericCitationStyle}}
  - Use author-year format: "Smith et al. (2023) found that..." or "Lanteigne (2017) argues..."
  - Or title references: "The study 'Arctic Governance' discusses..."
  {{/output.isNumericCitationStyle}}
  {{^output.isNumericCitationStyle}}
  - Use author-year format: "Smith et al. (2023) found that..." or "Lanteigne (2017) argues..."
  - Or title references: "The study 'Arctic Governance' discusses..."
  {{/output.isNumericCitationStyle}}
  
  ⚠️ **CRITICAL - NEVER expose paper IDs to users:**
  The paper_id values (UUIDs) are INTERNAL for CITATIONS blocks ONLY.
  NEVER include "Paper ID:", raw UUIDs, or "Cited Source:" blocks in conversational responses.
  
  ❌ **WRONG formats (citations will be STRIPPED):**
  ```
  "Claim [1]."
  Cited Source: [1] Smith (2023)
  ```
  ```
  "Claim [1]."
  [1] Heidbrink (2022)
  ```
  ```
  Cited Source:
  "Paper Title" (Author, Year): "quote"
  Paper ID: 01054e24-3b0d-429b-8fe1-1498e05a5fc7
  ```
  ```
  "claim [1] [1]"  ← duplicate citations
  ```
  ```
  "claim [CITE: abc123] [1]"  ← adding [1] where citation already exists
  ```
  
  ✅ **CORRECT format (citations will become clickable):**
  ```
  "Claim supported by research [1]."
  
  <!-- CITATIONS
  [1] paper_id: 9b3a0210-f79c-4b76-a675-2b3de888dd6b | quote: "Exact supporting sentence"
  -->
  ```
  {{^output.isNumericCitationStyle}}
  For conversational responses: "According to Lanteigne (2017), the research found that..."
  {{/output.isNumericCitationStyle}}
  "Existing claim [CITE: abc123] remains supported."  ← preserving existing citation
  
  **Rules:**
  - PRESERVE existing `[CITE: paperId]` markers when editing
  - Each NEW [N] marker MUST have a matching entry in the CITATIONS block
  - Get paper_ids ONLY from INTERNAL REFERENCE sections (look for `<!-- INTERNAL REFERENCE` comments)
  - Quote the EXACT supporting sentence from source
  - NEVER add a citation where one already exists (check for `[CITE: ...]`)
  - NEVER place same citation consecutively ([1] [1] is wrong)
  - Combine points from same source: "X and Y [1]" NOT "X [1]. Y [1]."
  
