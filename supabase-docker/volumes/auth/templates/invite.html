<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #1a1a1a; max-width: 480px; margin: 0 auto; padding: 40px 20px; background-color: #fafafa;">
  <div style="background: #ffffff; border-radius: 8px; border: 1px solid #e5e5e5; padding: 40px;">
    <div style="text-align: center; margin-bottom: 32px;">
      <h1 style="font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.02em;">GenPaper</h1>
    </div>
    
    <p style="margin: 0 0 16px 0; color: #1a1a1a;">You've been invited</p>
    
    <p style="margin: 0 0 24px 0; color: #666666;">You have been invited to create an account on GenPaper. Click below to accept the invitation and get started.</p>
    
    <div style="text-align: center; margin: 32px 0;">
      <a href="{{ .ConfirmationURL }}" style="display: inline-block; background: #1a1a1a; color: #ffffff; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: 500;">Accept invitation</a>
    </div>
    
    <p style="margin: 24px 0 0 0; color: #999999; font-size: 13px;">If you weren't expecting this invitation, you can ignore this email.</p>
  </div>
  
  <p style="color: #999999; font-size: 12px; text-align: center; margin-top: 24px;">
    <a href="https://genpaper.ai" style="color: #999999; text-decoration: none;">genpaper.ai</a>
  </p>
</body>
</html>
